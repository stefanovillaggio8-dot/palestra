name: Probe public gallery asset endpoints
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/probe-public-gallery.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public asset accessibility (no signed links)
        run: |
          for url in \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/bf59edc6-35ca-4a20-9f69-c8cce260c736.png' \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/e400b93d-42f9-4316-8a45-335778d799e5.png' \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/57c701e4-c053-4566-a019-9526689645a8.png'; do
            echo "Checking public unsigned image source"
            curl --location --fail --silent --show-error --max-time 15 --output /dev/null "$url"
          done
