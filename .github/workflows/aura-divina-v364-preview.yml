name: Create Divine Aura Only Preview
on:
  push:
    branches: ["preview/aura-divina-effetto-v364"]
    paths: ["aura-divina-v364.trigger"]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/aura-divina-effetto-v364
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download NEW effect-only artwork (no figure)
        env:
          SOURCE_URL: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/92150c35-42af-4dc8-a59b-931c2c7e1525/b119133a-bc56-4ff9-8d74-d102b2123448/Create_one_premium__professional_fantasy_RPG_game_AURA_cosme.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTEwODQ4MmNiZTY1NWYyYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzU3MDg2MH0.3L4Fk1PFb2c3-LIbfTlUiGBocgpEUHJGT3_b8Hg1kY4'
        run: |
          mkdir -p img/effetti
          curl -fsSL --retry 3 --max-time 120 "$SOURCE_URL" -o img/effetti/aura-divina-v364-source.png
      - name: Build accurate original/modified portrait comparison
        run: python tools/render_aura_divina_v364.py
      - name: Validate image pixel fidelity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          a=Path('img/effetti/aura-divina-v364.webp')
          assert a.exists()
          with Image.open(a) as im:
            assert im.size==(720,1080)
            im=im.convert('RGBA')
            for x,y in [(360,180),(360,330),(360,510),(360,720)]:
              assert im.getpixel((x,y))[3] == 0,(x,y,im.getpixel((x,y)))
          assert Path('docs/aura-divina-v364-confronto.jpg').stat().st_size>100000
          assert len(list(Path('docs').glob('aura-v364-*-stadio*.webp')))==3
          print('Original bodies and faces preserved: effect only')
          PY
      - name: Commit only preview assets to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/aura-divina-v364-source.png img/effetti/aura-divina-v364.webp docs/aura-divina-v364-confronto.jpg docs/aura-v364-*.webp
          git rm -f aura-divina-v364.trigger
          git commit -m 'assets: new standalone Aura Divina v364 and before/after preview'
          git push origin HEAD:preview/aura-divina-effetto-v364
