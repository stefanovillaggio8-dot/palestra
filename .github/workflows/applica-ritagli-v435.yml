name: Applica foto CAD originale viola e ritagli v435
on:
  push:
    branches:
      - fix/cad-originale-ritagli-v435
    paths:
      - .github/workflows/applica-ritagli-v435.yml

permissions:
  contents: write

jobs:
  edit-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica branch di prova
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installa librerie per il ritaglio immagini
        run: python -m pip install --disable-pip-version-check --quiet Pillow numpy opencv-python-headless
      - name: Aggiorna foto gia esistenti senza inventare un altro CAD
        run: python tools/ritagli-esercizi-v435.py
      - name: Verifica che i dati non siano toccati e pubblica sul branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --name-only | grep -v '^img/esercizi/' && {
            echo "Modifica fuori dagli asset, blocco pubblicazione."
            exit 1
          } || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/esercizi/cad-curl-app.jpg img/esercizi/cad-curl-originale-v435.jpg
          git add img/esercizi/*.png
          git diff --cached --quiet && { echo "Nessuna modifica immagini"; exit 1; }
          git commit -m "v435: CAD originale su fondo viola e zoom uniforme 11 esercizi"
          git push origin "HEAD:${GITHUB_REF_NAME}"
