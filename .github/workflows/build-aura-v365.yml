name: Build nine approved Divine Aura portraits
on:
  push:
    branches: [feature/aura-divina-v365-nove-varianti]
    paths: [aura-divina-v365.trigger]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aura-divina-v365-nove-varianti
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install Pillow numpy
      - name: Retrieve the exact user-approved golden aura reference
        env:
          APPROVED_IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/b84809ca-bb12-45c2-ab22-f157b547732e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWM5NjY0OTRjMTE5YTlkMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzU4OTM5Nn0.5OR39FxT5no9wvai2Zs9hXj_hIVjxbF2Oiv2X4YwGfQ'
        run: |
          mkdir -p img/effetti
          curl -fsSL --retry 3 --max-time 90 "$APPROVED_IMAGE_URL" -o img/effetti/aura-divina-v365-reference.png
          python - <<'PY'
          from PIL import Image
          with Image.open('img/effetti/aura-divina-v365-reference.png') as img:
              assert img.format=='PNG',img.format
              assert img.size[0]>900 and img.size[1]>1300,img.size
              img.verify()
          PY
      - name: Compose nine original photos with the same aura
        run: python tools/build_aura_divina_v365.py
      - name: Validate presence, resolution and stage-based weapons
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          paths=sorted(Path('img/personaggi/aura-divina-v365').rglob('*.webp'))
          assert len(paths)==9,len(paths)
          digests=set()
          for path in paths:
              with Image.open(path) as img:
                  assert img.size==(720,1080),(path,img.size)
                  img.verify()
              digests.add(hashlib.sha256(path.read_bytes()).hexdigest())
          assert len(digests)==9
          assert Path('docs/aura-divina-v365-nove-foto.jpg').stat().st_size>50000
          assert Path('img/effetti/aura-divina-v365-effetto.webp').stat().st_size>30000
          print('9 distinct portraits verified, three classes and three stages')
          PY
      - name: Commit preview assets to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/personaggi/aura-divina-v365 img/effetti/aura-divina-v365-effetto.webp docs/aura-divina-v365-nove-foto.jpg
          git rm -f aura-divina-v365.trigger
          git commit -m 'assets(v365): 9 real streak-stage photos with approved divine energy'
          git push origin HEAD:feature/aura-divina-v365-nove-varianti
