name: Generate v543 full approved photographic scenes
on:
  push:
    branches:
      - fix/v543-scene-reference-completa-senza-buchi
    paths:
      - tools/build-reference-scene-v543.py
      - .github/workflows/build-reference-scene-v543.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/v543-scene-reference-completa-senza-buchi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Reconstruct five original stages and preview three character progressions
        run: python tools/build-reference-scene-v543.py
      - name: Keep approved stage only in fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/reference-scene-v543.webp img/effetti/reference-scene-v543.json
          git commit -m 'assets(v543): restore original stone floor and magic without old avatar' || exit 0
          git pull --rebase origin fix/v543-scene-reference-completa-senza-buchi
          git push origin HEAD:fix/v543-scene-reference-completa-senza-buchi
