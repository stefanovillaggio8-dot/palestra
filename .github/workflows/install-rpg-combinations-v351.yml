name: Install photographic RPG outfit combinations v351
on:
  push:
    branches: [main]
    paths:
      - 'rpg-render-v351.trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging dependencies
        run: python -m pip install pillow
      - name: Render all 216 photographic variants without moving faces/weapons
        run: python tools/render_rpg_effect_photos.py
      - name: Assert every class, armor and Streak state is present
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('img/personaggi/combinazioni')
          for cls,arm in {
            'assassino':['armatura-assassino-notte','armatura-assassino-spettro'],
            'guerriero':['armatura-guerriero-braci','armatura-guerriero-abisso'],
            'berserker':['armatura-berserker-rabbia','armatura-berserker-apocalisse'],
          }.items():
            for st in [*(f'stato-{i}' for i in range(6)),*arm]:
              assets=list((base/cls/st).glob('*.webp'))
              assert len(assets)==9,(cls,st,len(assets))
              for asset in assets:
                im=Image.open(asset)
                assert im.width>=320 and im.height>=480,asset
          assert len(list(base.rglob('*.webp')))==216
          print('216 photographic variants across 3 classes verified')
          PY
      - name: Commit images to GitHub and remove temporary trigger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/personaggi/combinazioni
          git rm -f rpg-render-v351.trigger
          git commit -m "assets(v351): 216 outfit/streak/effect photographs"
          git push origin HEAD:main
      - name: Rebuild GitHub Pages after image installation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
