name: Diagnostic alpha RGB cutouts
on:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_cutout_alpha.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install Pillow
      - run: python tools/inspect_cutout_alpha.py
