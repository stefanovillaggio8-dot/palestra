name: Render 9 original characters with one identical Divine Aura v376
on:
  push:
    branches: [main]
    paths:
      - 'rpg-divine-v376.trigger'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact image-matting and rendering dependencies
        run: python -m pip install "Pillow>=10,<12" "numpy>=1.26,<3" "onnxruntime>=1.19,<2" "rembg>=2.0.60,<3"
      - name: Produce nine clean and equally framed photos
        run: python tools/render_divine_v376.py
      - name: Validate nine distinct original-identity mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          rows=json.loads(Path('docs/aura-divina-v376-manifest.json').read_text())
          assert len(rows)==9
          assert len({(row['classe'],row['armatura']) for row in rows})==9
          assert len({row['final_sha256'] for row in rows})==9
          assert {row['aura_template'] for row in rows}=={'v376-single-gold-376'}
          for row in rows:
              a=Path(row['source'])
              b=Path('img/personaggi/aura-divina-v376')/row['classe']/(row['armatura']+'.webp')
              assert hashlib.sha256(a.read_bytes()).hexdigest()==row['source_sha256']
              assert hashlib.sha256(b.read_bytes()).hexdigest()==row['final_sha256']
              assert row['canvas']==[720,1080] and row['head_y']==78 and row['feet_y']==997
              with Image.open(b) as im: assert im.size==(720,1080)
          assert Path('docs/aura-divina-v376-preview.jpg').stat().st_size>50000
          print('Nine distinct, consistent V376 photos validated')
          PY
      - name: Commit verified generated WebP and preview (do not change app yet)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/personaggi/aura-divina-v376 docs/aura-divina-v376-preview.jpg docs/aura-divina-v376-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(v376): nine characters isolated from baked-in old effects'
          git pull --rebase origin main
          git push origin HEAD:main
