name: Publish the nine approved Divine Aura images v379
on:
  push:
    branches: [main]
    paths:
      - 'aura_divina_v379_9_immagini.zip'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Validate all nine WebP photos and update PWA/gallery
        run: python tools/install_divine_v379.py aura_divina_v379_9_immagini.zip
      - name: Check nine photos, album and version
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          rows=json.loads(Path('docs/aura-divina-v379-manifest.json').read_text())
          assert len(rows)==9
          assert len({(x['classe'],x['armatura']) for x in rows})==9
          for x in rows:
              with Image.open(x['file']) as f: assert f.format=='WEBP' and f.size==(720,1080)
          assert 'palestra-v379' in Path('index.html').read_text()
          assert 'palestra-v379' in Path('sw.js').read_text()
          assert 'aura-divina-v379' in Path('src/foto-aura-divina-v366.js').read_text()
          assert Path('aura-divina-v366-anteprima.html').read_text().count('<figure>')==9
          PY
      - name: Commit only fully verified assets and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/personaggi/aura-divina-v379 docs index.html sw.js anteprima-aura.html aura-divina-v366-anteprima.html galleria-aura.html src/foto-aura-divina-v366.js src/galleria-foto-rpg.js test
          git diff --cached --quiet && exit 0
          git commit -m 'release(v379): publish nine approved identical Divine Aura pictures'
          git pull --rebase origin main
          git push origin HEAD:main
