name: v541 restore original photographic environment
on:
  push:
    branches: [fix/v541-reintegrate-original-floor-and-background]
    paths:
      - tools/v541-restore-original-environment.py
      - .github/workflows/v541-restore-original-environment.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v541-reintegrate-original-floor-and-background
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - run: python tools/v541-restore-original-environment.py
      - name: Commit new environment only on fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/reference-ambiente-v541.webp
          git commit -m 'assets(v541): restored photographic background and pavement from approved reference' || exit 0
          git pull --rebase origin fix/v541-reintegrate-original-floor-and-background
          git push origin HEAD:fix/v541-reintegrate-original-floor-and-background
