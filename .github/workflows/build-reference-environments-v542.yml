name: Build v542 feathered original environmental atlas
on:
  push:
    branches: [fix/v542-sfondo-senza-rettangolo-con-pavimento]
    paths: ['tools/build-reference-environments-v542.py','.github/workflows/build-reference-environments-v542.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/v542-sfondo-senza-rettangolo-con-pavimento,persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python tools/build-reference-environments-v542.py
      - name: Commit verified five-scene atlas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/reference-ambienti-v542.webp
          git commit -m 'assets(v542): soft photographic atmospheres without rectangular edges' || exit 0
          git pull --rebase origin fix/v542-sfondo-senza-rettangolo-con-pavimento
          git push origin HEAD:fix/v542-sfondo-senza-rettangolo-con-pavimento
