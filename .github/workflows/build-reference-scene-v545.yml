name: Rebuild approved RPG photo effect stages v545
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-reference-scene-v545.py'
permissions:
  contents: write
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo processing
        run: python -m pip install Pillow numpy opencv-python-headless
      - name: Preserve full colored scenes and photographic floor
        run: python tools/build-reference-scene-v545.py
      - name: Commit generated WebP and metadata to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/reference-scene-v545.webp img/effetti/reference-scene-v545.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(v545): full-color original photographed magic and complete floors'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep 2
          done
      - name: Build Pages with binary effect atlas
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
