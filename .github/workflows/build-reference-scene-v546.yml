name: Build transparent original photographic RPG effects v546
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-reference-scene-v546.py'
permissions:
  contents: write
  pages: write
jobs:
  build-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging libraries
        run: python -m pip install Pillow numpy opencv-python-headless
      - name: Build and validate five reference-effect stages
        run: python tools/build-reference-scene-v546.py
      - name: Commit approved VFX atlas and its metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/reference-scene-v546.webp img/effetti/reference-scene-v546.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(v546): five original effects without old knight or hard photo edges'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep 2
          done
      - name: Trigger Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
