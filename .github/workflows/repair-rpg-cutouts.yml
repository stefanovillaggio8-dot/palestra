name: Ripara veri ritagli RPG (pelle e armature)
on:
  push:
    branches: [main]
    paths:
      - 'tools/repair_rpg_cutouts.py'
permissions:
  contents: write
  pages: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow opencv-python-headless
      - run: python tools/repair_rpg_cutouts.py
      - name: Commit riparazioni senza toccare l'app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/personaggi/cutout/stati/
          git commit -m "assets: completa volto, mani e silhouette dei cutout" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep 2
          done
      - name: Build Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
