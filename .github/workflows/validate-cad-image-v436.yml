name: Check CAD PNG/JPEG v436
on:
  push:
    branches: [feature/lat-prese-cad-icon-v436]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: |
          python - <<'PY'
          from PIL import Image
          p='img/esercizi/cad-curl-app.jpg'
          im=Image.open(p)
          im.verify()
          im=Image.open(p)
          im.load()
          assert im.size == (220,220), im.size
          assert im.mode=='RGB',im.mode
          print('PASS JPEG',im.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verifica-foto-cad-v436
          path: img/esercizi/cad-curl-app.jpg
          retention-days: 1
