name: Render one uniform golden Divine Aura v375
on:
  push:
    branches: [main]
    paths:
      - 'rpg-divine-v375.trigger'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render the nine originals with the same gold aura geometry
        run: python tools/render_divine_v375.py
      - name: Verify all original assets and dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          rows=json.loads(Path('docs/aura-divina-v375-manifest.json').read_text())
          assert len(rows)==9
          assert len({(x['classe'],x['armatura']) for x in rows})==9
          assert len({x['final_sha256'] for x in rows})==9
          assert len({x['aura_template'] for x in rows})==1
          for r in rows:
              a=Path('img/personaggi/aura-divina-v374')/r['classe']/(r['armatura']+'.webp')
              b=Path('img/personaggi/aura-divina-v375')/r['classe']/(r['armatura']+'.webp')
              assert hashlib.sha256(a.read_bytes()).hexdigest()==r['original_sha256']
              assert hashlib.sha256(b.read_bytes()).hexdigest()==r['final_sha256']
              assert r['canvas']==[720,1080]
              with Image.open(b) as im: assert im.size==(720,1080)
          assert Path('docs/aura-divina-v375-preview.jpg').stat().st_size>50000
          print('PASS: nine matching Divine Aura assets')
          PY
      - name: Commit verified new photo files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/personaggi/aura-divina-v375 docs/aura-divina-v375-preview.jpg docs/aura-divina-v375-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(v375): unify Divine Aura geometry on nine original portraits'
          git pull --rebase origin main
          git push origin HEAD:main
