name: Installa icona Dumbbell Face Pull v458
on:
  push:
    branches: ['fix/dumbbell-face-pull-v458']
    paths:
      - '.github/workflows/installa-facepull-v458.yml'
      - 'tools/facepull-v458/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifica icona e aggiorna solo rendering, galleria e cache
        run: python tools/facepull-v458/apply.py
      - name: Controlla che l'icona sia presente e valida
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('img/esercizi/verificati-v458/ex-dumbbell-face-pull.webp')
          assert p.exists() and p.stat().st_size>8000
          assert "palestra-v458" in Path("sw.js").read_text()
          assert "verificati-v458/ex-dumbbell-face-pull.webp" in Path("verifica-icone.html").read_text()
          print("Asset pronto:", p.stat().st_size, "bytes")
          PY
      - name: Registra le modifiche sul ramo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Palestra v458: face pull ai manubri busto inclinato e cache coerente' || exit 0
          git push origin HEAD:fix/dumbbell-face-pull-v458
