name: Import exactly approved five RPG previews v548
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-approved-v548.py'
permissions:
  contents: write
  pages: write
jobs:
  import-approved-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install Pillow numpy opencv-python-headless
      - name: Extract exact approved five effect scenes and clean dynamic variants
        run: python tools/build-approved-v548.py
      - name: Commit static sprites to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/effetti/approved-showcase-v548.webp img/effetti/approved-environments-v548.webp img/effetti/approved-v548-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'assets(v548): use exact five approved user image previews'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$i" = 5 ]; then exit 1; fi
            sleep 2
          done
