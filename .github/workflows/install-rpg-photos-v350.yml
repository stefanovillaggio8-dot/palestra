name: Install photographic RPG effects v350
on:
  push:
    branches: [main]
    paths: ['rpg-photo-import-v350.json']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download approved images and install crisp full-resolution assets
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          import urllib.request,json,io
          manifest=Path('rpg-photo-import-v350.json')
          sources=json.loads(manifest.read_text())
          def fetch(name):
              req=urllib.request.Request(sources[name],headers={'User-Agent':'RPG-Photos-Installer/1.0'})
              with urllib.request.urlopen(req,timeout=120) as req:
                  raw=req.read(14_000_000)
              if len(raw)>14_000_000: raise RuntimeError('Input oversize')
              return Image.open(io.BytesIO(raw)).convert('RGB')
          def webp(im,path,q=88):
              p=Path(path);p.parent.mkdir(parents=True,exist_ok=True)
              im.save(p,'WEBP',quality=q,method=6)
              print(p,im.size,p.stat().st_size)
          for effetto in ('ambra','fulmine','astrale'):
              immagine=fetch(effetto+'_triptych')
              if immagine.width<1400 or immagine.height<850:
                  raise RuntimeError(f'Image not high resolution: {effetto} {immagine.size}')
              for i,cl in enumerate(('assassino','guerriero','berserker')):
                  x0=round(immagine.width*i/3);x1=round(immagine.width*(i+1)/3)
                  photo=immagine.crop((x0,0,x1,immagine.height))
                  webp(photo,f'img/personaggi/effetti/{cl}-{effetto}.webp',91)
          spettro=fetch('spettro_hd')
          if spettro.width<900 or spettro.height<1300:
              raise RuntimeError('New Spettro Cremisi lacks high-definition resolution')
          webp(spettro,'img/personaggi/armature/assassino-spettro.webp',93)
          mini=spettro.copy()
          mini.thumbnail((300,450),Image.Resampling.LANCZOS)
          webp(mini,'img/personaggi/armature/assassino-spettro-mini.webp',90)
          poster=fetch('effetti_catalogo')
          webp(poster,'img/personaggi/catalogo/effetti-3-classi-v350.webp',90)
          manifest.unlink()
          print('All nine full-size effect photos, Spettro and gallery installed without changing account data.')
          PY
      - name: Verify assets are sharp and complete
        run: |
          python - <<'PY'
          from PIL import Image
          for c in ('assassino','guerriero','berserker'):
              for effect in ('ambra','fulmine','astrale'):
                  im=Image.open(f'img/personaggi/effetti/{c}-{effect}.webp')
                  assert im.width>=480 and im.height>=850,(c,effect,im.size)
          s=Image.open('img/personaggi/armature/assassino-spettro.webp')
          assert s.width>=900 and s.height>=1300,s.size
          assert Image.open('img/personaggi/catalogo/effetti-3-classi-v350.webp').width>=1400
          print('All photographic originals verified.')
          PY
      - name: Commit the photographs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/personaggi/effetti img/personaggi/armature/assassino-spettro.webp img/personaggi/armature/assassino-spettro-mini.webp img/personaggi/catalogo
          git rm -f -- rpg-photo-import-v350.json
          git commit -m "assets(v350): high-resolution photographed effects and sharp Spettro for all classes"
          git push origin HEAD:main
      - name: Request Pages rebuild for new photography
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
