name: v539 - Ripulisci i cinque VFX dagli avatar estranei
on:
  push:
    branches:
      - fix/v539-cutout-veri-effetti
    paths:
      - tools/clean-reference-v539.py
      - .github/workflows/generate-reference-v539.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/v539-cutout-veri-effetti
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installazione Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Mantieni solo i pixel autentici dei cinque effetti
        run: python tools/clean-reference-v539.py
      - name: Anteprima compressa per verifica reale (nessun PNG inventato)
        run: |
          python - <<'PY'
          import io,base64
          from PIL import Image
          atlas=Image.open('img/effetti/effetti-reference-v539.webp').convert('RGBA')
          plate=Image.new('RGB',atlas.size,(6,7,16))
          plate.paste(atlas,mask=atlas.getchannel('A'))
          plate.thumbnail((690,442),Image.Resampling.LANCZOS)
          out=io.BytesIO()
          plate.save(out,format='JPEG',quality=68,optimize=True)
          encoded=base64.b64encode(out.getvalue()).decode('ascii')
          print('V539_PREVIEW_META:'+str(len(out.getvalue()))+':'+str(len(encoded)),flush=True)
          for i in range(0,len(encoded),3500):
              print('V539_PREVIEW_PART:'+str(i//3500).zfill(4)+':'+encoded[i:i+3500],flush=True)
          print('V539_PREVIEW_END',flush=True)
          PY
      - name: Salva sul ramo di correzione, non su main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/effetti/effetti-reference-v539.webp
          git commit -m "assets(v539): cinque VFX puliti senza personaggi sovrapposti" || exit 0
          git pull --rebase origin fix/v539-cutout-veri-effetti
          git push origin HEAD:fix/v539-cutout-veri-effetti
