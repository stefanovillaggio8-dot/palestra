name: v541 visual diagnostic original stage
on:
  push:
    branches: [fix/v541-reintegrate-original-floor-and-background]
    paths: ['tools/v541-stage-reference-diagnostic.py','.github/workflows/v541-original-stage-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python tools/v541-stage-reference-diagnostic.py
