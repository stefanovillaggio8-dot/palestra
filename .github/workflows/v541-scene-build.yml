name: v541 generate five original photograph environments
on:
  push:
    branches: [fix/v541-reintegrate-original-floor-and-background]
    paths: [tools/v541-restore-five-original-panels.py,.github/workflows/v541-scene-build.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/v541-reintegrate-original-floor-and-background,persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python tools/v541-restore-five-original-panels.py
      - name: Save 5 original scene assets on fix branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/effetti/reference-scene-v541.webp
          git commit -m "assets(v541): five original photographic effects, backgrounds and floors" || exit 0
          git pull --rebase origin fix/v541-reintegrate-original-floor-and-background
          git push origin HEAD:fix/v541-reintegrate-original-floor-and-background
