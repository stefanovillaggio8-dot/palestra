name: v541 preview original platform + photographic ground
on:
  push:
    branches: [fix/v541-reintegrate-original-floor-and-background]
    paths: [tools/v541-restore-original-environment.py,.github/workflows/v541-preview-floor.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
      - run: python tools/v541-restore-original-environment.py
