name: Import six armed Shop armors with Divine Aura v366
on:
  push:
    branches: ['fix/aura-divina-v366-armature-shop-complete']
    paths: ['aura-divina-v366.trigger']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aura-divina-v366-armature-shop-complete
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install Pillow
      - name: Fetch full newly generated shop armor images
        run: |
          set -euo pipefail
          mkdir -p docs/aura-divina-v366-import
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/eaf397ff-e430-4340-979a-c7e992f522fe/f9079f9f-0022-4d88-bad9-5a93ae6e9733/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWRkMTJkOWJkNGIxMzMwOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNjIwODkxfQ.KMgzRni2H5qYqVwzya5mQlwUnkI0infJ7Yfq5kU8AYE' -o 'docs/aura-divina-v366-import/armatura-assassino-notte.png'
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/7965d73a-a71a-454a-acb9-dad5be67c32f/760ec5bc-26a7-4230-9234-e3629018ecdf/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmJlMjdhMjUyZjUyMzA5NyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNTkwODIxfQ.Ev0Dk2KktOZGxYHeCVuJB9rHTyRm5uQmbpkTUHVEV48' -o 'docs/aura-divina-v366-import/armatura-assassino-spettro.png'
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/4387ff76-4b0a-44db-b2e1-b0118a29829e/a6ab6f3f-f050-499a-88ec-dfc0a99b0e1d/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTQzYWZjNmY5ODk3OTViYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNjEwNzM1fQ.RTEcRfTz5-W-LAyuVblbvjk3vUUOSrKoV-5rCE99JA0' -o 'docs/aura-divina-v366-import/armatura-guerriero-braci.png'
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/7972797a-f589-4ebc-9845-694ab42bb47e/269eba38-13cf-4100-a863-efba65ac7d1e/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWZmYWM4NzAzNWI0ODhkNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNjUxMzEyfQ.O-rUNb04NAQ_TEjFqf3L1b-U10ApCnX7gtmGvOxVz-Y' -o 'docs/aura-divina-v366-import/armatura-guerriero-abisso.png'
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/3e21a219-f592-48cd-b983-09803e5a3d38/636076f3-531b-439f-bc36-0827154a8dab/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmY5NTlkNDdjODMwMTgzMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNTc4MTgzfQ.m1WKsyzSd5rxRJJOhdjEi1XIjT2TTt9G8FFq_8e70iI' -o 'docs/aura-divina-v366-import/armatura-berserker-rabbia.png'
          curl -fLsS --retry 3 --retry-all-errors --max-time 110 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/99665523-2c26-4245-acca-d26cb63f3f33/e4fa259d-a49d-4193-ad7a-e04ee1a73fd8/ONE_fully_realized_full_body_photographic_dark_fantasy_RPG_p.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2EyMmU4ODhjMzE1NDU0MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWF5LXRhc2stYXJ0aWZhY3RzIiwic3RhZ2UiOiJwcm9kIiwiZXhwIjoxNzkzNTc0MjgwfQ.9NMY6vVC-wXHDJstytCiLVFlyMUFzgLK5SWpMsYrFiA' -o 'docs/aura-divina-v366-import/armatura-berserker-apocalisse.png'
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for f in sorted(Path('docs/aura-divina-v366-import').glob('*.png')):
              with Image.open(f) as im:
                  assert im.format=='PNG'
                  assert min(im.size)>900,(f,im.size)
                  im.verify()
          assert len(list(Path('docs/aura-divina-v366-import').glob('*.png')))==6
          print('Six distinct complete Shop images downloaded')
          PY
      - name: Generate nine complete approved aura images
        run: python tools/build_aura_divina_v366.py
      - name: Verify all published photo files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          files=list(Path('img/personaggi/aura-divina-v366').rglob('*.webp'))
          assert len(files)==9,len(files)
          digests=set()
          for f in files:
              with Image.open(f) as im:
                  assert im.size==(720,1080),(f,im.size)
                  im.verify()
              digests.add(hashlib.sha256(f.read_bytes()).hexdigest())
          assert len(digests)==9
          assert Path('docs/aura-divina-v366-shop-completo.jpg').stat().st_size>60000
          print('9 unique full-size divinely crowned? NO: aura ONLY. Validated.')
          PY
      - name: Commit final images and preview to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/personaggi/aura-divina-v366 docs/aura-divina-v366-shop-completo.jpg
          git rm aura-divina-v366.trigger
          git commit -m 'assets(v366): 3 armed classes × 3 genuine armors, with golden Divine Aura'
          git push origin HEAD:fix/aura-divina-v366-armature-shop-complete
