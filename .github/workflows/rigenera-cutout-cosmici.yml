name: Rigenera cutout cosmici v491
on:
  push:
    branches:
      - fix/v491-cutout-integrity-preview
    paths:
      - scripts/genera_cutout_cosmici.py
      - .github/workflows/rigenera-cutout-cosmici.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ramo di prova
        uses: actions/checkout@v4
        with:
          ref: fix/v491-cutout-integrity-preview
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dipendenze isolate
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]==2.0.67' 'Pillow>=11,<12' 'numpy<3'
      - name: Rigenera solo soggetti validati
        run: python scripts/genera_cutout_cosmici.py
      - name: Salva i risultati su questo ramo (non pubblicare la main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/personaggi/cutout/stati/ src/rpg-scena-cosmica.js
          if git diff --cached --quiet; then
            echo "Nessuna immagine nuova"
          else
            git commit -m "assets(rpg): 18 ritratti alpha validati v491"
            git push origin HEAD:fix/v491-cutout-integrity-preview
          fi
