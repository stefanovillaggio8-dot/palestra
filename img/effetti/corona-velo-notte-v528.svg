<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b16b27"/><stop offset=".28" stop-color="#ffe8a2"/>
      <stop offset=".55" stop-color="#fffbd5"/><stop offset=".82" stop-color="#e7a84a"/>
      <stop offset="1" stop-color="#9c501d"/>
    </linearGradient>
    <radialGradient id="luce">
      <stop stop-color="#ffe7a2" stop-opacity=".29"/>
      <stop offset=".58" stop-color="#ffc877" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffe7a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="bagliore" x="-80%" y="-150%" width="260%" height="400%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="runa"><path d="M0-10L6 0 0 10-6 0Z" fill="none" stroke="url(#oro)" stroke-width="2"/><circle r="1.6" fill="#fff6c6"/></g>
    <g id="scintilla"><path d="M0-10L2-2 10 0 2 2 0 10-2 2-10 0-2-2Z" fill="#fff1bd"/></g>
  </defs>
  <!-- Corona sospesa sopra il cappuccio: non copre viso, corpo né pugnali. -->
  <ellipse cx="450" cy="110" rx="230" ry="138" fill="url(#luce)"/>
  <ellipse cx="450" cy="72" rx="112" ry="19" fill="none" stroke="#efbd63" stroke-width="10" opacity=".45" filter="url(#bagliore)"/>
  <ellipse cx="450" cy="72" rx="112" ry="19" fill="none" stroke="url(#oro)" stroke-width="4.4"/>
  <path d="M340 70L359 36 378 61 404 25 430 56 450 13 470 56 496 25 522 61 541 36 560 70" fill="none" stroke="url(#oro)" stroke-linejoin="round" stroke-width="4"/>
  <path d="M352 69Q450 87 548 69" fill="none" stroke="#fff4c0" stroke-width="2.2" opacity=".8"/>
  <circle cx="450" cy="46" r="7" fill="#f7e8ba" stroke="#fff" stroke-width="1.4"/>
  <g opacity=".85">
    <use href="#runa" transform="translate(332 68) scale(.6)"/>
    <use href="#runa" transform="translate(572 68) scale(.6)"/>
    <use href="#runa" transform="translate(299 113) scale(.52)"/>
    <use href="#runa" transform="translate(601 113) scale(.52)"/>
    <use href="#scintilla" transform="translate(291 58) scale(.47)"/>
    <use href="#scintilla" transform="translate(612 48) scale(.53)"/>
    <use href="#scintilla" transform="translate(227 192) scale(.38)"/>
    <use href="#scintilla" transform="translate(676 200) scale(.36)"/>
  </g>
  <!-- Alone regale leggero ai lati, senza incollare un nuovo sfondo. -->
  <path d="M275 280C168 400 211 660 165 850M625 280C733 420 690 665 733 858" fill="none" stroke="#f0c477" stroke-width="2" stroke-dasharray="6 24" opacity=".35"/>
