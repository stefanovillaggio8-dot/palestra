<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 890" preserveAspectRatio="none" role="img" aria-label="Aura divina: portale celeste azzurro">
<defs>
  <linearGradient id="celeste" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b4f6ff"/><stop offset=".36" stop-color="#55e4ff"/>
    <stop offset=".67" stop-color="#657aff"/><stop offset="1" stop-color="#e9c6ff"/>
  </linearGradient>
  <radialGradient id="foschia">
    <stop stop-color="#7cecff" stop-opacity="0"/>
    <stop offset=".68" stop-color="#44baff" stop-opacity=".05"/>
    <stop offset=".85" stop-color="#429afe" stop-opacity=".27"/>
    <stop offset="1" stop-color="#2374da" stop-opacity="0"/>
  </radialGradient>
  <filter id="luce" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <g id="scintilla">
    <path d="M0-12 L2-2 L12 0 L2 2 L0 12 L-2 2 L-12 0 L-2-2Z" fill="#b9faff"/>
    <circle r="2.5" fill="#fff"/>
  </g>
</defs>
<!-- Zona centrale trasparente: nessun tratto attraversa viso, torso o armatura. -->
<ellipse cx="320" cy="453" rx="305" ry="420" fill="url(#foschia)" opacity=".92"/>
<g fill="none" stroke="#3ab5ff" stroke-width="17" opacity=".34" filter="url(#luce)">
  <path d="M144 80 C-19 240, 17 675, 166 802"/>
  <path d="M496 80 C659 240, 623 675, 474 802"/>
  <path d="M136 159 C56 350, 59 570, 124 682"/>
  <path d="M504 159 C584 350, 581 570, 516 682"/>
</g>
<g fill="none" stroke="url(#celeste)" stroke-linecap="round" stroke-width="3.8">
  <path d="M142 75 C8 205, 24 635, 154 807" opacity=".89"/>
  <path d="M498 75 C632 205, 616 635, 486 807" opacity=".89"/>
  <path d="M121 177 C49 360, 60 602, 132 724" opacity=".54"/>
  <path d="M519 177 C591 360, 580 602, 508 724" opacity=".54"/>
  <path d="M177 38 C205 14, 266 11, 302 7 M338 7 C397 14, 454 37, 469 57" opacity=".52"/>
  <path d="M180 852 Q320 894 458 852" opacity=".79"/>
</g>
<!-- Raggi verticali separati dalla corona dorata e senza ali. -->
<g stroke="url(#celeste)" stroke-width="2.1" opacity=".75">
  <path d="M77 215 l-36 -58 M563 215 l36 -58"/>
  <path d="M66 356 l-52 -16 M574 356 l52 -16"/>
  <path d="M64 530 l-42 23 M576 530 l42 23"/>
  <path d="M98 700 l-39 54 M542 700 l39 54"/>
  <path d="M164 800 l-22 57 M476 800 l22 57"/>
</g>
<g opacity=".86">
  <use href="#scintilla" transform="translate(104 122) scale(.55)"/>
  <use href="#scintilla" transform="translate(548 115) scale(.74)"/>
  <use href="#scintilla" transform="translate(64 277) scale(.37)"/>
  <use href="#scintilla" transform="translate(580 314) scale(.63)"/>
  <use href="#scintilla" transform="translate(77 487) scale(.71)"/>
  <use href="#scintilla" transform="translate(564 499) scale(.52)"/>
  <use href="#scintilla" transform="translate(124 676) scale(.60)"/>
  <use href="#scintilla" transform="translate(519 714) scale(.78)"/>
  <use href="#scintilla" transform="translate(193 833) scale(.47)"/>
  <use href="#scintilla" transform="translate(453 841) scale(.51)"/>
</g>
<!-- Sigillo a pavimento AZZURRO: la Corona ha invece la sua corona dorata in alto. -->
<g fill="none" stroke="url(#celeste)" opacity=".87">
  <ellipse cx="320" cy="850" rx="232" ry="24" stroke-width="3"/>
  <ellipse cx="320" cy="850" rx="186" ry="13" stroke-width="1.8" stroke-dasharray="4 8"/>
  <path d="M190 850 L254 830 L320 850 L386 830 L450 850 L386 866 L320 850 L254 866 Z" stroke-width="1.8"/>
</g>
</svg>