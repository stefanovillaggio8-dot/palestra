<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Strict Curl con bilanciere EZ, schiena al muro e piedi leggermente avanzati">
<defs><radialGradient id="bg" cx=".45" cy=".34" r=".75"><stop stop-color="#a638ec"/><stop offset=".6" stop-color="#7625bb"/><stop offset="1" stop-color="#260b48"/></radialGradient><linearGradient id="bar"><stop stop-color="#d9dae4"/><stop offset="1" stop-color="#6c738b"/></linearGradient><linearGradient id="skin"><stop stop-color="#ffcf91"/><stop offset="1" stop-color="#d58c55"/></linearGradient><linearGradient id="shirt"><stop stop-color="#b84aff"/><stop offset="1" stop-color="#61109b"/></linearGradient><style>.edge{stroke:#27162e;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}.line{stroke:#27162e;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}</style></defs>
