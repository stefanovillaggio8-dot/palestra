<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palestra · Astrale e Nebulosa sui personaggi</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;color:#f5eefc;background:#090c14}
  header{padding:20px 16px 14px;max-width:1100px;margin:auto}
  h1{font-size:clamp(1.15rem,4vw,1.8rem);margin:0 0 8px}
  p{margin:0;color:#b8b6cb;font-size:.88rem;line-height:1.5}
  .comandi{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:17px 0 0}
  .comandi label{font-size:.9rem}
  .comandi select{padding:8px 14px;border:1px solid #48435f;border-radius:9px;background:#1d1a2c;color:#fff}
  .galleria{max-width:1100px;margin:auto;padding:10px 12px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .scheda{position:relative;overflow:hidden;border:1px solid #322d45;border-radius:15px;padding:11px 7px 12px;background:linear-gradient(152deg,#151322 0%,#161627 50%,#0b111c 100%)}
  .scheda h2{margin:0 0 2px;font-size:.9rem;text-align:center;letter-spacing:.01em}
  .scheda p{text-align:center;font-size:.71rem}
  .ritratto{position:relative;width:100%;max-width:340px;margin:8px auto 0;aspect-ratio:2/3;isolation:isolate}
  .ritratto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;filter:drop-shadow(0 8px 15px rgba(0,0,0,.42))}
  .ritratto img.fondale{z-index:0;filter:brightness(.74) saturate(.89)}
  .ritratto canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ritratto canvas.retro{z-index:1}
  .ritratto canvas.fronte{z-index:3;mix-blend-mode:screen}
  .etichetta{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.68rem;letter-spacing:.04em}
  .mitico{background:#553082;color:#f7daff}
  .leggendario{background:#174e65;color:#bff7ff}
  @media(min-width:850px){.galleria{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.scheda{padding:14px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Effetti cosmici sui personaggi originali</h1>
  <p>Questa anteprima usa le stesse immagini trasparenti e lo stesso motore dell'app. Cambia soltanto l'effetto; corpo, posa, armi, armatura e zoom rimangono invariati.</p>
  <div class="comandi"><label for="stato">Stato Streak</label><select id="stato">
    <option value="0">0 · Base</option><option value="1">1 · Bracciali</option><option value="2">2 · Corazza</option>
    <option value="3">3 · Armatura</option><option value="4">4 · Arma</option><option value="5" selected>5 · Completo</option>
  </select></div>
</header>
<main id="galleria" class="galleria"></main>
<script type="module">
import {caricaEnergiaFotograficaRpg,disegnaEnergiaFotograficaRpg} from './src/rpg-energia-incarnata.js';
let texturaCosmica=null;
void caricaEnergiaFotograficaRpg().then(img=>{texturaCosmica=img;});
const classi=['assassino','guerriero','berserker'];
const galleria=document.getElementById('galleria'),stato=document.getElementById('stato');
let schede=[],tempo=0;
for(const classe of classi)for(const effetto of ['astrale','nebulosa']){
  const box=document.createElement('section');box.className='scheda';
  const titolo=document.createElement('h2');titolo.textContent=classe[0].toUpperCase()+classe.slice(1);
  const descr=document.createElement('p');descr.innerHTML=effetto==='astrale'
    ?'<span class="etichetta mitico">MITICO · ASTRALE COSMICO</span>'
    :'<span class="etichetta leggendario">LEGGENDARIO · NEBULOSA COSMICA</span>';
  const ritratto=document.createElement('div');ritratto.className='ritratto';
  const fondale=document.createElement('img');fondale.className='fondale';fondale.alt='';fondale.decoding='async';
  const retro=document.createElement('canvas');retro.className='retro';
  const img=document.createElement('img');img.alt=classe+' originale';img.decoding='async';
  const front=document.createElement('canvas');front.className='fronte';
  ritratto.append(fondale,retro,img,front);box.append(titolo,descr,ritratto);galleria.append(box);
  const buffer=document.createElement('canvas');
  schede.push({classe,effetto,retro,front,img,fondale,ritratto,buffer});
}
function cambiaStato(){
  for(const c of schede){
    c.fondale.src=`./img/personaggi/stati/${c.classe}-${stato.value}.webp?v=502`;
    c.img.src=`./img/personaggi/cutout/stati/${c.classe}-${stato.value}.webp?v=502`;
  }
}
stato.addEventListener('change',cambiaStato);cambiaStato();
const ridotto=matchMedia('(prefers-reduced-motion:reduce)').matches;
let ultimo=-Infinity;
for(const c of schede)c.img.addEventListener('load',()=>{if(ridotto)ultimo=-Infinity;});
function render(ms){
  requestAnimationFrame(render);
  if(ms-ultimo<50&&!ridotto)return;
  if(ridotto&&ultimo!==-Infinity)return;
  ultimo=ms;tempo=ridotto?2.8:ms/1000;
  for(const c of schede){
    const width=Math.round(c.ritratto.clientWidth),height=Math.round(c.ritratto.clientHeight);
    if(width<16||height<20)continue;
    for(const canvas of [c.retro,c.front]){
      if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
    }
    const behind=c.retro.getContext('2d'),fore=c.front.getContext('2d');
    behind.clearRect(0,0,width,height);fore.clearRect(0,0,width,height);
    disegnaEnergiaFotograficaRpg(behind,width,height,c.classe,c.effetto,tempo,{fase:'retro',texture:texturaCosmica});
    disegnaEnergiaFotograficaRpg(fore,width,height,c.classe,c.effetto,tempo,{
      fase:'fronte',texture:texturaCosmica,soggetto:c.img.complete&&c.img.naturalWidth?c.img:null,buffer:c.buffer,
    });
  }
}
requestAnimationFrame(render);
</script>
</body>
</html>
