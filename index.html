<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra</title>
<meta name="description" content="La mia scheda di palestra: giorni, serie, pesi, spotter e progressi.">
<meta name="theme-color" content="#0b0910">
<link rel="manifest" href="./manifest.webmanifest">
<script>
// Ogni persona installa la SUA app, quindi ognuna ha il suo manifesto.
// ?p=2 -> "Palestra A" (Andrea), ?n=nome&k=chiave -> il manifest "nuovo" (chi si
// registra col link), tutto il resto -> la scheda di Stefano.
//
// Il manifest "nuovo" esiste perche' senza, un amico che apre ?n=luca&k=aa11
// prenderebbe quello di Stefano: si troverebbe un'app chiamata "la mia scheda",
// con lo stesso id (e quindi installandola sostituirebbe quella di Ste) e con
// start_url che punta a ?p=1, cioe' che gli aprirebbe SEMPRE il profilo di Ste.
(function () {
  try {
    var q = window.location.search || '';
    var nome = /[?&]n=/.test(q);
    var m = /[?&]p=(\d+)/.exec(q);
    var scelto = nome ? 'nuovo' : (m && m[1] === '2' ? 'p2' : 'p1');
    var link = document.querySelector('link[rel="manifest"]');
    if (link) link.setAttribute('href', './manifest-' + scelto + '.webmanifest');
  } catch (e) { /* pazienza: resta il manifesto di base */ }
})();
</script>
<link rel="icon" href="./img/logo.png">
<link rel="apple-touch-icon" href="./img/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./stile.css?v=96">
<!--
  LA VERSIONE NEL COLLEGAMENTO AL FOGLIO DI STILE.

  Ste (10/10/2026): "comunque le animazioni non le vedo".

  Il foglio si chiamava sempre "stile.css", senza niente che cambiasse: il
  browser lo teneva in cache per mesi, e il risultato era che il CSS nuovo
  arrivava a chi apriva la pagina per la prima volta e a chi no'. Le animazioni
  esistevano online (verificato: "dialogo-entra", "avviso-entra" e "numero-pulse"
  erano tutti serviti), ma il telefono di Ste continuava a disegnare con il foglio
  di prima.

  Con il "?v=84" l'indirizzo cambia a ogni versione, quindi la cache del browser
  non può più restituire il foglio vecchio. Il numero va cambiato insieme a
  PALESTRA_VERSIONE qui sotto e nella cache del service worker.
-->
</head>
<body>
<div class="stato-save" id="stato-salvataggio">
  <span class="pallino-stato pallino-neutro"></span>
  <span class="testo-stato">Avvio...</span>
  <span id="avviso-conflitti"></span>
</div>
<div id="app">
  <div class="caricamento">Carico i tuoi dati...</div>
</div>
<!-- v61: la divisione (III/II/I) e gli LP erano due numeri che non tornavano
     insieme, su 11 righe su 20: il bonus spingeva gli LP senza ricalcolare la
     divisione. Trovato leggendo il telefono. Il numero di versione sta in DUE
     file, questo e sw.js: i test I2 e I3 lo controllano. -->
<script>window.PALESTRA_VERSIONE = '96';</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
